name: Build and deploy Gimnazija app

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-push-web:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: prepare for build
        uses: ./.github/actions/prepare_docker_build
        with:
          gh_actor: ${{ github.actor }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          file: web/Dockerfile
          target: production
          platforms: linux/amd64
          context: .
          tags: |
            ghcr.io/kapobajza/gimnazija_web:prod
            ghcr.io/kapobajza/gimnazija_web:${{ github.sha }}
  
  build-and-push-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: prepare for build
        uses: ./.github/actions/prepare_docker_build
        with:
          gh_actor: ${{ github.actor }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          file: dashboard/Dockerfile
          target: production
          platforms: linux/amd64
          context: .
          tags: |
            ghcr.io/kapobajza/gimnazija_api:prod
            ghcr.io/kapobajza/gimnazija_api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push-web, build-and-push-dashboard]
    env:
      # Directory on the VPS that holds the compose file, .env and secrets/.
      REMOTE_DIR: /home/deploy/gimnazija
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yaml
          target: ${{ env.REMOTE_DIR }}

      - name: Deploy with docker compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: GIT_COMMIT_HASH,DATABASE_NAME,DATABASE_USERNAME,GH_ACTOR,GH_TOKEN
          script: |
            set -e
            cd ${{ env.REMOTE_DIR }}

            cat > .env <<EOF
            GIT_COMMIT_HASH=${GIT_COMMIT_HASH}
            DATABASE_NAME=${DATABASE_NAME}
            DATABASE_USERNAME=${DATABASE_USERNAME}
            EOF

            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml up -d --remove-orphans
            docker compose -f docker-compose.prod.yaml ps
        env:
          GIT_COMMIT_HASH: ${{ github.sha }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}